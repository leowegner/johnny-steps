<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Johnny's Steps</title>
<style>
  :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1c1c1e; --accent:#ff4d6d; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f5f7; --fg:#111; --muted:#666; --card:#fff; --accent:#d6204a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:var(--bg); padding:10px 16px;
           display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px;
           border-bottom:1px solid #8884; }
  h1 { font-size:1.1rem; margin:0; margin-right:auto; }
  .group { display:flex; gap:6px; }
  button { font:inherit; color:var(--fg); background:var(--card); border:1px solid #8886;
           border-radius:999px; padding:8px 14px; cursor:pointer; min-height:40px; }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  section.wrap { max-width:1200px; margin:auto; padding:16px; }
  h2.title { font-size:1.05rem; margin:8px 0; }
  video { display:block; width:100%; max-height:70vh; background:#000; object-fit:contain; border-radius:12px; }
  .jumps { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .jumps button { font-size:.85rem; padding:6px 10px; min-height:34px; }
  .jumps button b { color:var(--muted); font-weight:500; margin-right:4px; }
  main { display:grid; gap:20px; padding:0 16px 32px; max-width:1200px; margin:auto;
         grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); }
  .card { background:var(--card); border-radius:12px; overflow:hidden; }
  .card h3 { font-size:1rem; margin:0; padding:12px 14px; display:flex; gap:8px; align-items:baseline; }
  .card h3 span { color:var(--muted); font-weight:400; font-size:.85rem; margin-left:auto; }
  .card video { border-radius:0; }
</style>
</head>
<body>
<header>
  <h1>Johnny's steps</h1>
  <div class="group" role="group" aria-label="Playback speed">
    <button type="button" data-speed="0.5" aria-pressed="false">Half speed</button>
    <button type="button" data-speed="1" aria-pressed="false">Full speed</button>
  </div>
  <div class="group" role="group" aria-label="Sound">
    <button type="button" id="sound" aria-pressed="false">Sound off</button>
  </div>
  <div class="group" role="group" aria-label="View">
    <button type="button" data-view="both" aria-pressed="false">Both</button>
    <button type="button" data-view="johnny" aria-pressed="false">Johnny</button>
    <button type="button" data-view="baby" aria-pressed="false">Baby</button>
  </div>
</header>

<section class="wrap">
  <h2 class="title">Whole dance</h2>
  <video id="full" muted loop playsinline controls preload="metadata"></video>
  <div class="jumps" id="jumps"></div>
</section>

<section class="wrap"><h2 class="title">Step by step</h2></section>
<main id="steps"></main>

<script>
// [clip number, name, start in the song (seconds)]
const STEPS = [
  [12, "Walk-in and dip", 10],
  [13, "Close hold and reach up", 23],
  [14, "Hand-hold wide stance and twirl out", 31],
  [1,  "Arm sway and cross", 60],
  [2,  "Knee-lift bounce", 64],
  [3,  "Reach up with partner", 68],
  [4,  "Open-arm hop", 70.4],
  [15, "Swap places", 81],
  [16, "Step-touch and reach apart", 85.5],
  [5,  "Push lunge", 166.8],
  [7,  "Hands on hips sway", 121],
  [6,  "Wide legs point and roll-in", 201],
  [8,  "Arms overhead lunge", 212.5],
  [9,  "Kneel and skirt push", 225],
  [10, "Dip", 241],
  [18, "Hand to head wide steps", 255],
  [17, "Embrace and run-off", 269],
  [11, "Final lift", 275.5],
];
// Jump buttons for the whole-dance player, in song order. Times are seconds into the song.
const FULL_START = 10;
const SECTIONS = [
  ["Walk-in and dip", 10], ["Close hold", 23], ["Hand-hold stance", 31],
  ["Sway and cross", 50], ["Reach and hops", 68], ["Swap places", 81],
  ["Step-touch", 85.5], ["Push lunge", 96], ["Wide legs point", 111],
  ["Hands on hips", 121], ["Twirls and hops", 136], ["Push lunge 2", 166.8],
  ["Wide legs point 2", 201], ["Arms overhead", 212.5], ["Kneel", 225],
  ["Dip", 241], ["Hand to head", 255], ["Embrace", 269], ["Final lift", 275.5],
];

const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let speed = parseFloat(store.get("speed", "0.5"));
let view = store.get("view", "both");

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// Whole-dance player
const full = document.getElementById("full");
const jumps = document.getElementById("jumps");
for (const [label, t] of SECTIONS) {
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = `<b>${fmt(t)}</b>${label}`;
  b.addEventListener("click", () => { full.currentTime = t - FULL_START; full.play().catch(() => {}); });
  jumps.appendChild(b);
}

// Step cards
const main = document.getElementById("steps");
const cards = [];
for (const [n, name, t] of STEPS) {
  const card = document.createElement("section");
  card.className = "card";
  card.innerHTML = `<h3>${name}<span>from ${fmt(t)}</span></h3><video muted loop playsinline controls preload="metadata"></video>`;
  main.appendChild(card);
  cards.push({ n, v: card.querySelector("video") });
}
const allVideos = [full, ...cards.map(c => c.v)];

function setSrc(v, src) {
  if (v.getAttribute("src") === src) return;
  const t = v.currentTime, wasPlaying = !v.paused;
  v.setAttribute("src", src);
  v.addEventListener("loadedmetadata", () => {
    v.currentTime = Math.min(t, v.duration || t);
    v.playbackRate = speed;
    if (wasPlaying) v.play().catch(() => {});
  }, { once: true });
}
function apply() {
  setSrc(full, view === "baby" ? "full_baby.mp4" : "full.mp4");
  for (const { n, v } of cards) {
    // "Both" is the wide shot. Steps 1 and 2 have a tight Johnny clip, so they get their own wide one.
    const dir = view === "baby" ? "clips/baby/" : view === "both" && (n === 1 || n === 2) ? "clips/both/" : "clips/";
    setSrc(v, `${dir}${n}.mp4`);
  }
  for (const v of allVideos) v.playbackRate = speed;
  for (const b of document.querySelectorAll("[data-speed]"))
    b.setAttribute("aria-pressed", String(parseFloat(b.dataset.speed) === speed));
  for (const b of document.querySelectorAll("[data-view]"))
    b.setAttribute("aria-pressed", String(b.dataset.view === view));
}
for (const b of document.querySelectorAll("[data-speed]"))
  b.addEventListener("click", () => { speed = parseFloat(b.dataset.speed); store.set("speed", speed); apply(); });
for (const b of document.querySelectorAll("[data-view]"))
  b.addEventListener("click", () => { view = b.dataset.view; store.set("view", view); apply(); });

// Browsers block unmuted autoplay, so videos start muted and the Sound button unmutes them.
// Only one video has sound at a time: the one under the pointer, else the most visible playing one.
let sound = false;
let hovered = null;
const visible = new Map();
const soundBtn = document.getElementById("sound");
function activeVideo() {
  if (hovered) return hovered;
  let best = null, bestRatio = 0;
  for (const v of allVideos) {
    const r = visible.get(v) || 0;
    if (!v.paused && r > bestRatio) { best = v; bestRatio = r; }
  }
  return best;
}
function applySound() {
  const active = sound ? activeVideo() : null;
  for (const v of allVideos) v.muted = v !== active;
  soundBtn.textContent = sound ? "Sound on" : "Sound off";
  soundBtn.setAttribute("aria-pressed", String(sound));
}
soundBtn.addEventListener("click", () => { sound = !sound; applySound(); });
for (const v of allVideos) {
  v.addEventListener("pointerenter", () => { hovered = v; applySound(); });
  v.addEventListener("pointerleave", () => { if (hovered === v) hovered = null; applySound(); });
  v.addEventListener("play", applySound);
  v.addEventListener("pause", applySound);
}
applySound();

// Browsers can reset playbackRate on play; reapply.
for (const v of allVideos) v.addEventListener("play", () => { v.playbackRate = speed; });

// Step clips play only while mostly on screen; the whole-dance player starts only when the user presses play.
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    visible.set(e.target, e.intersectionRatio);
    if (e.target === full) { if (e.intersectionRatio === 0) full.pause(); continue; }
    if (e.intersectionRatio >= 0.5) { e.target.playbackRate = speed; e.target.play().catch(() => {}); }
    else e.target.pause();
  }
  applySound();
}, { threshold: [0, 0.25, 0.5, 0.75, 1] });
cards.forEach(c => io.observe(c.v));
io.observe(full);
apply();
</script>
</body>
</html>
